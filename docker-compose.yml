services:
  # MySQL Relational Database Service
  db:
    image: mysql:8.0
    container_name: expense_tracker_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secure_password}
      MYSQL_DATABASE: ${DB_NAME:-expense_tracker}
      MYSQL_USER: ${DB_USER:-expense_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-expense_password}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./app/database/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "3306:3306"
    networks:
      - expense_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_secure_password}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # Flask Web Application Service
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: expense_tracker_web
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-5000}:5000"
    environment:
      - FLASK_APP=app:create_app
      - FLASK_ENV=production
      - FLASK_DEBUG=0
      - PORT=5000
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-expense_tracker}
      - DB_USER=${DB_USER:-expense_user}
      - DB_PASSWORD=${DB_PASSWORD:-expense_password}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - expense_network

volumes:
  mysql_data:
    driver: local

networks:
  expense_network:
    driver: bridge
